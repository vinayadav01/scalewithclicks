<!-- =========================================
     UNIVERSAL HEADER
     Scale With Clicks
========================================= -->

<style>
/* ================================
   UNIVERSAL NAVBAR
================================ */

.scw-header {
  position: sticky;
  top: 0;
  z-index: 9999;
  width: 100%;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid #e5e7eb;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
}

.scw-header-inner {
  width: 100%;
  max-width: 1250px;
  min-height: 90px;
  margin: 0 auto;
  padding: 10px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}

/* ================================
   LOGO
================================ */

.scw-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
  flex-shrink: 0;
}

.scw-logo img {
  width: auto;
  height: 72px;
  max-width: 200px;
  display: block;
  object-fit: contain;
}

/* ================================
   DESKTOP NAVIGATION
================================ */

.scw-nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 22px;
}

.scw-nav a {
  display: inline-flex;
  align-items: center;

  color: #0f172a;
  text-decoration: none;

  font-family: 'Poppins', sans-serif;
  font-size: 15px;
  font-weight: 500;

  padding: 10px 4px;

  transition: color 0.25s ease;
}

.scw-nav a:hover {
  color: #2563eb;
}

/* Contact Button */

.scw-nav .scw-contact-btn {
  padding: 11px 20px;
  border-radius: 30px;

  color: #ffffff !important;

  background: linear-gradient(
    135deg,
    #0ea5e9,
    #2563eb
  );

  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.20);

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease;
}

.scw-nav .scw-contact-btn:hover {
  color: #ffffff !important;
  transform: translateY(-2px);

  box-shadow: 0 9px 22px rgba(37, 99, 235, 0.28);
}

/* ================================
   MOBILE MENU BUTTON
================================ */

.scw-menu-btn {
  width: 44px;
  height: 44px;

  display: none;

  align-items: center;
  justify-content: center;

  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;

  cursor: pointer;

  padding: 0;
}

/* Hamburger */

.scw-hamburger {
  width: 21px;
  height: 16px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.scw-hamburger span {
  display: block;

  width: 100%;
  height: 2px;

  background: #0f172a;

  border-radius: 5px;

  transition: 0.25s ease;
}

/* X animation */

.scw-menu-btn.active .scw-hamburger span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.scw-menu-btn.active .scw-hamburger span:nth-child(2) {
  opacity: 0;
}

.scw-menu-btn.active .scw-hamburger span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

/* ================================
   MOBILE
================================ */

@media (max-width: 768px) {

  .scw-header-inner {
    min-height: 78px;
    padding: 8px 18px;
  }

  .scw-logo img {
    height: 58px;
    max-width: 180px;
  }

  .scw-menu-btn {
    display: flex;
  }

  .scw-nav {
    position: absolute;

    top: 100%;
    left: 15px;
    right: 15px;

    display: none;

    flex-direction: column;
    align-items: stretch;

    gap: 4px;

    padding: 18px;

    background: #ffffff;

    border: 1px solid #e2e8f0;
    border-radius: 18px;

    box-shadow: 0 15px 40px rgba(15, 23, 42, 0.12);
  }

  .scw-nav.active {
    display: flex;
  }

  .scw-nav a {
    width: 100%;
    padding: 12px 10px;
    border-radius: 8px;
  }

  .scw-nav a:hover {
    background: #f8fafc;
  }

  .scw-nav .scw-contact-btn {
    justify-content: center;
    margin-top: 6px;
  }
}

/* Smaller phones */

@media (max-width: 480px) {

  .scw-header-inner {
    padding-left: 15px;
    padding-right: 15px;
  }

  .scw-logo img {
    height: 52px;
  }

}
</style>


<header class="scw-header">

  <div class="scw-header-inner">

    <!-- LOGO -->
    <a
      href="https://scalewithclicks.com/"
      class="scw-logo"
      aria-label="Scale With Clicks Home"
    >
      <img
        src="/logo.png"
        alt="Scale With Clicks"
      >
    </a>


    <!-- MOBILE MENU BUTTON -->
    <button
      type="button"
      class="scw-menu-btn"
      id="scwMenuBtn"
      aria-label="Open navigation menu"
      aria-expanded="false"
    >
      <span class="scw-hamburger">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>


    <!-- NAVIGATION -->
    <nav
      class="scw-nav"
      id="scwNav"
      aria-label="Main navigation"
    >

      <a href="https://scalewithclicks.com/">
        Home
      </a>

      <a href="https://scalewithclicks.com/aboutus">
        About Us
      </a>

      <a href="https://scalewithclicks.com/services">
        Services
      </a>

      <a href="https://scalewithclicks.com/casestudy">
        Case Studies
      </a>

      <a
        href="https://blog.scalewithclicks.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        Blog
      </a>

      <a
        href="https://scalewithclicks.com/contactus"
        class="scw-contact-btn"
      >
        Contact Us
      </a>

    </nav>

  </div>

</header>


<script>
(function () {

  const menuButton = document.getElementById("scwMenuBtn");
  const navigation = document.getElementById("scwNav");

  if (!menuButton || !navigation) {
    return;
  }

  menuButton.addEventListener("click", function (event) {

    event.stopPropagation();

    navigation.classList.toggle("active");
    menuButton.classList.toggle("active");

    const isOpen = navigation.classList.contains("active");

    menuButton.setAttribute(
      "aria-expanded",
      isOpen ? "true" : "false"
    );

  });


  /* Close menu when clicking a link */

  navigation.querySelectorAll("a").forEach(function (link) {

    link.addEventListener("click", function () {

      navigation.classList.remove("active");
      menuButton.classList.remove("active");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );

    });

  });


  /* Close menu when clicking outside */

  document.addEventListener("click", function (event) {

    if (
      !navigation.contains(event.target) &&
      !menuButton.contains(event.target)
    ) {

      navigation.classList.remove("active");
      menuButton.classList.remove("active");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );

    }

  });

})();
</script>
